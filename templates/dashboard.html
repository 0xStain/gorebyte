<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoreByte - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff1744, #d50000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-top: 5px;
            font-size: 0.95em;
        }

        .card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 16px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #00e676;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(0, 230, 118, 0); }
        }

        .status-text {
            color: #00e676;
            font-weight: 500;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: #0a0a10;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #ff1744;
        }

        .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a24;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #ccc;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .badge-green {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
        }

        .footer {
            text-align: center;
            color: #333;
            font-size: 0.8em;
            margin-top: 20px;
        }

        a {
            color: #ff1744;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <meta http-equiv="refresh" content="30">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔴 GoreByte</div>
            <p class="subtitle">Monitoring System</p>
        </div>

        <div class="card">
            <div class="card-title">Status</div>
            <div class="status-row">
                <div class="pulse"></div>
                <span class="status-text">Active & Monitoring</span>
            </div>
            <p style="color: #555; margin-top: 8px; font-size: 0.9em;">
                Checking every 60 seconds via Vercel Cron
            </p>
        </div>

        <div class="card">
            <div class="card-title">Configuration</div>
            <div class="info-row">
                <span class="info-label">Source URL</span>
                <span class="info-value">secret</span>
            </div>
            <div class="info-row">
                <span class="info-label">Check Interval</span>
                <span class="info-value">** seconds</span>
            </div>
            <div class="info-row">
                <span class="info-label">Discord Webhook</span>
                <span class="badge badge-green">Configured ✅</span>
            </div>
            <div class="info-row">
                <span class="info-label">Platform</span>
                <span class="info-value">Pluto Star</span>
            </div>
        </div>
    </div>
</body>
</html>
